name: vaultix
description: Vaultix - Your Digital Life. One Secure Vault.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  sqflite: ^2.3.3
  path: ^1.9.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  file_picker: ^8.1.6
  path_provider: ^2.1.4
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Generate the Android launcher icon with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/vaultix_icon.png"
  adaptive_icon_background: "#7655E8"
  adaptive_icon_foreground: "assets/icon/vaultix_foreground.png"
  min_sdk_android: 23
